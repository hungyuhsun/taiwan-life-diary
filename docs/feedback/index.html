<style>
:root{--ink:#1B2A36;--ink2:#4A5A68;--paper:#EEF2F5;--line:#D5DDE3;--orange:#E8741C;--orange-d:#B4520C;--peach:#FCE7D4;--navy:#26324A;--ok:#2C8A57}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","Noto Sans Thai","Noto Sans Myanmar","Noto Sans Khmer","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6}
body[data-lang="my"],body[data-lang="km"]{line-height:1.9}
.wrap{max-width:680px;margin:0 auto;padding:0 16px 48px}
header{background:var(--navy);color:#fff}
header .wrap{padding-top:20px;padding-bottom:20px}
header h1{margin:0;font-size:1.5rem}
header p{margin:4px 0 0;opacity:.85}
.langs{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.langs button{font:inherit;font-size:.9rem;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;padding:7px 12px;border-radius:999px;min-height:40px;cursor:pointer}
.langs button[aria-pressed="true"]{background:#fff;color:var(--navy)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:16px}
.card h2{margin:0 0 4px;font-size:1.1rem}
.q{margin-top:18px}
.q:first-of-type{margin-top:8px}
.zh{display:block;font-size:.85rem;color:var(--ink2)}
.lab{display:block;font-weight:700;margin-bottom:8px}
.req{color:#C9402B;margin-left:4px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts label{position:relative}
.opts input{position:absolute;opacity:0;width:1px;height:1px}
.opts span{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 14px;min-height:44px;cursor:pointer}
.opts input:checked+span{background:var(--peach);border-color:var(--orange);color:#8A3E08;font-weight:700}
.opts input:focus-visible+span{outline:3px solid var(--orange);outline-offset:2px}
.stars span{min-width:52px;text-align:center;font-size:1.05rem}
.scale{display:flex;justify-content:space-between;font-size:.8rem;color:var(--ink2);margin-top:4px;max-width:330px}
textarea{width:100%;min-height:84px;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;resize:vertical}
textarea:focus{outline:3px solid var(--orange);outline-offset:1px}
.hint{font-size:.85rem;color:var(--ink2);margin-top:4px}
.btn{display:block;width:100%;border:0;background:var(--orange);color:#fff;font:inherit;font-weight:700;font-size:1.15rem;padding:16px;border-radius:14px;box-shadow:0 4px 0 var(--orange-d);cursor:pointer;margin-top:22px}
.btn[disabled]{opacity:.6;cursor:default}
.err{color:#C9402B;font-weight:700;margin-top:12px;display:none}
.done{display:none;text-align:center;padding:40px 20px}
.done b{display:block;font-size:1.4rem;margin-bottom:8px;color:var(--ok)}
.done a{color:var(--orange-d);font-weight:700}
.bad{outline:2px solid #C9402B;border-radius:12px;outline-offset:4px}
</style>
</head>
<body data-lang="zh">
<header><div class="wrap">
  <h1>台灣生活日記・試玩回饋</h1>
  <p data-t="sub">謝謝你試玩！大約 3 分鐘，不用寫名字。</p>
  <div class="langs" role="group" aria-label="Language">
    <button type="button" data-l="zh">中文</button><button type="button" data-l="vi">Tiếng Việt</button><button type="button" data-l="id">Bahasa Indonesia</button><button type="button" data-l="th">ไทย</button><button type="button" data-l="km">ខ្មែរ</button><button type="button" data-l="my">မြန်မာ</button><button type="button" data-l="en">English</button>
  </div>
</div></header>

<main class="wrap">
<form id="f" novalidate>
  <div class="card">
    <h2 data-t="sec1">關於你</h2>
    <div class="q" data-name="country" data-req></div>
    <div class="q" data-name="dept"></div>
    <div class="q" data-name="grade" data-req></div>
    <div class="q" data-name="progress" data-req></div>
    <div class="q" data-name="device"></div>
  </div>
  <div class="card">
    <h2 data-t="sec2">遊戲感受</h2>
    <div class="q" data-name="fun" data-req></div>
    <div class="q" data-name="cont"></div>
    <div class="q" data-name="rec"></div>
    <div class="q" data-name="diff" data-req></div>
    <div class="q" data-name="trans"></div>
  </div>
  <div class="card">
    <h2 data-t="sec3">學習</h2>
    <div class="q" data-name="useful"></div>
    <div class="q" data-name="helpful"></div>
    <div class="q" data-name="hard"></div>
  </div>
  <div class="card">
    <h2 data-t="sec4">問題與建議</h2>
    <div class="q" data-name="problems"></div>
    <div class="q" data-name="probch"></div>
    <div class="q" data-name="like"></div>
    <div class="q" data-name="wish"></div>
    <p class="err" id="err" role="alert"></p>
    <button class="btn" id="send" type="submit" data-t="send">送出</button>
  </div>
</form>
<div class="card done" id="done" role="status">
  <b data-t="thx">謝謝你的回饋！</b>
  <p data-t="thx2">老師會用你的意見讓遊戲變得更好。</p>
  <p><a href="../" data-t="back">回到遊戲</a></p>
</div>
</main>

const P=new URLSearchParams(location.search);
let lang=(P.get('lang')||'').toLowerCase();
if(!LANGS.includes(lang)){ const n=(navigator.language||'').toLowerCase(); lang=n.startsWith('vi')?'vi':(n.startsWith('id')||n.startsWith('ms'))?'id':n.startsWith('th')?'th':n.startsWith('my')?'my':n.startsWith('km')?'km':n.startsWith('en')?'en':'zh'; }
const tr=(o)=>o[lang]||o.en||o.zh;

function build(){
  document.querySelectorAll('.q').forEach(box=>{
    const name=box.dataset.name, q=Q[name], req=box.hasAttribute('data-req');
    const keep=collectOne(name);
    box.innerHTML='';
    const lab=document.createElement('span'); lab.className='lab'; lab.id='l_'+name;
    lab.textContent=lang==='zh'?q.t.zh:tr(q.t); if(req){const r=document.createElement('span');r.className='req';r.textContent='*';lab.append(r);}
    if(lang!=='zh'){ const z=document.createElement('span'); z.className='zh'; z.textContent=q.t.zh; box.append(z); }
    box.append(lab);
    if(q.type==='text'){ const ta=document.createElement('textarea'); ta.name=name; ta.setAttribute('aria-labelledby','l_'+name); ta.maxLength=1000; if(q.short) ta.style.minHeight='56px'; ta.value=keep||''; box.append(ta); return; }
    const g=document.createElement('div'); g.className='opts'+(q.type==='star'?' stars':''); g.setAttribute('role',q.type==='many'?'group':'radiogroup'); g.setAttribute('aria-labelledby','l_'+name);
    const items=q.type==='star'?[1,2,3,4,5].map(v=>[String(v),null]):q.opts;
    items.forEach(([v,labs])=>{
      const l=document.createElement('label'), i=document.createElement('input'), s=document.createElement('span');
      i.type=q.type==='many'?'checkbox':'radio'; i.name=name; i.value=v;
      if(Array.isArray(keep)?keep.includes(v):keep===v) i.checked=true;
      s.textContent=q.type==='star'?'★'.repeat(+v):(lang==='zh'?v:(labs[lang]||v));
      if(q.type==='star') i.setAttribute('aria-label',v+' / 5');
      if(q.max) i.addEventListener('change',()=>{ const c=g.querySelectorAll('input:checked'); if(c.length>q.max) i.checked=false; });
      l.append(i,s); g.append(l);
    });
    box.append(g);
    if(q.type==='star'){ const sc=document.createElement('div'); sc.className='scale'; const a=document.createElement('span'); a.textContent=tr(UI.s1); const b=document.createElement('span'); b.textContent=tr(UI.s5); sc.append(a,b); box.append(sc); }
  });
  document.querySelectorAll('[data-t]').forEach(e=>{ e.textContent=tr(UI[e.dataset.t]); });
  document.documentElement.lang={zh:'zh-Hant-TW',vi:'vi',id:'id',th:'th',my:'my',en:'en'}[lang]; document.body.dataset.lang=lang;
  document.querySelectorAll('.langs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.l===lang)));
}
function collectOne(name){
  const els=[...document.querySelectorAll('[name="'+name+'"]')]; if(!els.length) return null;
  if(els[0].tagName==='TEXTAREA') return els[0].value;
  if(els[0].type==='checkbox') return els.filter(e=>e.checked).map(e=>e.value);
  const c=els.find(e=>e.checked); return c?c.value:null;
}
document.querySelectorAll('.langs button').forEach(b=>b.addEventListener('click',()=>{ lang=b.dataset.l; build(); }));
build();
// 從遊戲帶入的預設值
(function(){ const pre={country:P.get('home'),dept:P.get('dept')}; for(const [k,v] of Object.entries(pre)){ if(!v) continue; const i=document.querySelector('input[name="'+k+'"][value="'+CSS.escape(v)+'"]'); if(i) i.checked=true; }
  const ch=+P.get('ch'); const pr=isNaN(ch)||P.get('ch')===null?null:ch===0?'前傳':ch<=4?'第1–4章':ch<=8?'第5–8章':'第9–10章'; if(pr){ const i=document.querySelector('input[name="progress"][value="'+pr+'"]'); if(i) i.checked=true; } })();

document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const err=document.getElementById('err'); err.style.display='none';
  document.querySelectorAll('.bad').forEach(e=>e.classList.remove('bad'));
  const missing=[...document.querySelectorAll('.q[data-req]')].filter(b=>{ const v=collectOne(b.dataset.name); return !v||(Array.isArray(v)&&!v.length); });
  if(missing.length){ missing.forEach(b=>b.classList.add('bad')); err.textContent=tr(UI.need); err.style.display='block'; missing[0].scrollIntoView({behavior:'smooth',block:'center'}); return; }
  if(!/^https:\/\/script\.google\.com\//.test(SCRIPT_URL)){ err.textContent=tr(UI.nourl); err.style.display='block'; return; }
  const a={}; Object.keys(Q).forEach(k=>{ const v=collectOne(k); a[k]=Array.isArray(v)?v.join('、'):(v||''); });
  const payload={lang, src:P.get('src')||'', ch:P.get('ch')||'', glang:P.get('lang')||'', ua:navigator.userAgent.slice(0,200), ...a};
  const btn=document.getElementById('send'); btn.disabled=true; btn.textContent=tr(UI.sending);
  try{
    await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
    document.getElementById('f').style.display='none'; const d=document.getElementById('done'); d.style.display='block'; d.scrollIntoView({behavior:'smooth'});
  }catch(e){ err.textContent=tr(UI.fail); err.style.display='block'; btn.disabled=false; btn.textContent=tr(UI.send); }
});
