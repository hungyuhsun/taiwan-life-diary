<h1>台灣生活日記 語音產生器</h1>
<p class="mut">用學校的 Azure 語音服務，把遊戲裡的中文句子做成 mp3。金鑰只留在這台電腦，不會傳給別人。</p>

<div class="card">
<label for="key">金鑰（Azure 語音服務 →「金鑰和端點」→ 金鑰 1）</label>
<input id="key" type="password" autocomplete="off" placeholder="貼上金鑰">
<label for="region">區域（位置／區域）</label>
<input id="region" value="eastasia">
<p class="mut"><input type="checkbox" id="remember" style="width:auto"> 在這台電腦記住金鑰（公用電腦請不要勾）</p>
</div>

<div class="card">
<b>第 1 步：試聽每一種聲音</b>
<p class="mut">先確認金鑰可以用、聲音合適。</p>
<table id="voices"></table>
</div>

<div class="card">
<b>第 2 步：產生全部語音</b>
<p class="mut" id="summary"></p>
<button id="go">開始產生</button><button id="stop" class="sec" disabled>暫停</button>
<progress id="prog" value="0" max="1"></progress>
<p id="stat" class="mut"></p>
<p class="mut">中途關掉也沒關係，做好的檔案存在瀏覽器裡，下次打開按「開始產生」會從剩下的接著做。</p>
</div>

<div class="card">
<b>第 3 步：下載</b>
<p class="mut">下載 audio.zip，解壓縮後把 <code>audio</code> 資料夾放到遊戲 index.html 旁邊（伺服器上是 /var/www/html/twdiary/audio/）。</p>
<button id="zip">下載 audio.zip</button><button id="clear" class="sec">清除瀏覽器裡的檔案</button>
</div>
<div id="log"></div>
</main>

function makeZip(files){ const enc=new TextEncoder(), parts=[], cen=[]; let off=0;
  for(const [name,data] of files){ const n=enc.encode(name), crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30)); h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint32(14,crc,true); h.setUint32(18,data.length,true); h.setUint32(22,data.length,true); h.setUint16(26,n.length,true);
    parts.push(h.buffer,n,data);
    const c=new DataView(new ArrayBuffer(46)); c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint32(16,crc,true); c.setUint32(20,data.length,true); c.setUint32(24,data.length,true); c.setUint16(28,n.length,true); c.setUint32(42,off,true);
    cen.push(c.buffer,n); off+=30+n.length+data.length; }
  const csz=cen.reduce((s,x)=>s+(x.byteLength||x.length),0); const e=new DataView(new ArrayBuffer(22)); e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,csz,true); e.setUint32(16,off,true);
  return new Blob([...parts,...cen,e.buffer],{type:'application/zip'}); }
$('zip').onclick=async()=>{ const {ks}=await refresh(); const files=[]; const list=[];
  for(const j of JOBS) if(ks.has(j.h)){ const b=await getA(j.h); files.push(['audio/'+j.h+'.mp3',new Uint8Array(await b.arrayBuffer())]); list.push(j.h); }
  if(!files.length){ $('stat').textContent='還沒有做好的檔案。'; return; }
  files.push(['audio/index.json',new TextEncoder().encode(JSON.stringify(list))]);
  const a=document.createElement('a'); a.href=URL.createObjectURL(makeZip(files)); a.download='audio.zip'; a.click();
  $('stat').textContent=`已打包 ${list.length} 個檔案`+(list.length<JOBS.length?'（還沒全部完成，遊戲會先用有的檔案，其餘用手機語音）':''); };
</script></body></html>
