<title>台灣生活日記</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+Thai:wght@400;600&family=Noto+Sans+Myanmar:wght@400;600&family=Noto+Sans+Khmer:wght@400;600&display=swap">
<style>
/* Layout: one phone-shaped stage — top HUD, a scene card with the characters, and a dialogue/choice panel that grows from the bottom.
   Palette taken from 青年高中: school orange and emblem grey, navy-and-white plaid of the uniform. Single deliberate light look. */
:root{
  --ink:#1B2A36; --ink-2:#4A5A68; --paper:#EEF2F5; --card:#FFFFFF;
  --orange:#E8741C; --orange-soft:#FCE7D4; --grey:#A7AAAD; --plaid:#26324A;
  --ok:#2C8A57; --ok-soft:#DDF1E5; --no:#C9402B; --no-soft:#F8E0DC;
  --line:#D5DDE3;
  --f-display:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",serif;
  --f-ui:"Noto Sans TC","Noto Sans Thai","Noto Sans Myanmar","Noto Sans Khmer","Khmer OS","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-tr:"Noto Sans Thai","Noto Sans Myanmar","Noto Sans TC",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-block:12px 20px;gap:12px}

/* ---------- title ---------- */
.title-screen{display:flex;flex-direction:column;gap:18px;align-items:stretch;padding-top:12px}
.brand{display:flex;align-items:center;gap:12px}
.brand .seal{width:52px;height:52px;border-radius:50%;background:conic-gradient(var(--grey) 0 50%,var(--orange) 50% 100%);display:grid;place-items:center;flex:none}
.brand .seal span{width:30px;height:30px;border-radius:50%;background:var(--paper)}
.brand h1{font-family:var(--f-display);font-size:2.2rem;line-height:1.1;margin:0;font-weight:700;letter-spacing:.04em}
.brand p{margin:2px 0 0;color:var(--ink-2);font-size:.9rem}
.cast{display:flex;justify-content:center;align-items:flex-end;height:210px;position:relative;overflow:hidden;border-radius:18px;
  background:linear-gradient(180deg,#FFF 0%,#FFF 62%,var(--orange-soft) 62%);border:1px solid var(--line)}
.cast img{height:180px;margin:0 -14px;filter:drop-shadow(0 4px 0 rgba(27,42,54,.08))}
.chapter-tag{font-family:var(--f-display);font-size:1.15rem;background:var(--plaid);color:#fff;padding:10px 14px;border-radius:12px;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 6px,transparent 6px 18px),repeating-linear-gradient(0deg,rgba(255,255,255,.08) 0 6px,transparent 6px 18px)}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:1.05rem;background:var(--orange);color:#fff;box-shadow:0 3px 0 #B9560E}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #B9560E}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--line);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.small{font-size:.85rem;color:var(--ink-2)}
.linkbtn{display:block;text-align:center;text-decoration:none;color:var(--ink);margin:10px 0 4px}
.title-screen .info-link{display:block;text-align:center;font-weight:700;color:#B4520C;padding:10px 0}

/* ---------- setup ---------- */
.setup{display:flex;flex-direction:column;gap:16px}
.setup h2{font-family:var(--f-display);font-size:1.4rem;margin:0}
.field{display:flex;flex-direction:column;gap:8px}
.field > label,.field > .lab{font-weight:700}
.heroes{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.heroes .hero-card{flex:0 0 calc(25% - 6px)}
.hero-card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.hero-card img{height:88px;object-fit:contain}
.hero-card .hc{font-size:.75rem;color:var(--ink-2);white-space:nowrap}
.hero-card[aria-pressed="true"]{border-color:var(--orange);background:var(--orange-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--orange);background:var(--orange-soft)}
input[type=text],select{font:inherit;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:100%;box-sizing:border-box}

/* ---------- game ---------- */
.hud{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.when{display:flex;align-items:baseline;gap:8px;min-width:0}
.when b{font-family:var(--f-display);font-size:1.15rem}
.slot{font-size:.8rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--plaid);color:#fff}
.gear{border:0;background:transparent;font-size:1.3rem;padding:4px 6px;border-radius:8px}
.meters{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr) auto;gap:8px;align-items:center}
.meter{display:flex;flex-direction:column;gap:2px;font-size:.72rem;color:var(--ink-2);min-width:0}
.meter .bar{height:8px;border-radius:99px;background:#E3E8EC;overflow:hidden}
.meter .bar i{display:block;height:100%;border-radius:99px;background:var(--orange);transition:width .5s}
.meter.mood .bar i{background:#E2A11C}.meter.tidy .bar i{background:#2E9C8E}.meter.tidy.low .bar i{background:#C9402B}.meter.skill .bar i{background:var(--plaid)}
.money{font-variant-numeric:tabular-nums;font-weight:700;font-size:.95rem;white-space:nowrap}

.stage{position:relative;height:240px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.stage .bg{position:absolute;inset:0;transition:background .4s}
.stage .place{position:absolute;left:14px;top:10px;font-family:var(--f-display);font-size:3.4rem;line-height:1;color:rgba(27,42,54,.10);letter-spacing:.06em;pointer-events:none}
.app.q .stage{height:150px}.app.q .sprite.npc{height:140px}.app.q .sprite.me{height:110px}.app.q .avatar{width:84px;height:84px;font-size:2.2rem;bottom:24px}
.stage,.sprite{transition:height .25s}
.sprite{position:absolute;bottom:0;transition:opacity .25s,transform .25s}
.sprite.npc{right:6%;height:220px}
.sprite.me{left:4%;height:170px}
.avatar{position:absolute;right:10%;bottom:30px;width:118px;height:118px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--f-display);font-size:3rem;color:#fff;border:5px solid #fff;box-shadow:0 6px 0 rgba(27,42,54,.12)}
.avatar small{position:absolute;bottom:-26px;font-family:var(--f-ui);font-size:.75rem;color:var(--ink-2);white-space:nowrap}
.fxpop{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:4px;align-items:flex-end;pointer-events:none}
.fxpop span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700;animation:pop 2.4s forwards}
@keyframes pop{0%{opacity:0;transform:translateY(6px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}

.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:150px}
.who{align-self:flex-start;font-weight:700;font-size:.85rem;padding:2px 10px;border-radius:999px;background:var(--orange-soft);color:#9A4A0C}
.who.me{background:#E2E8F3;color:var(--plaid)}
.line{display:flex;gap:10px;align-items:flex-start}
.zh{font-family:var(--f-display);font-size:1.45rem;line-height:1.45;margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.py{font-size:.85rem;color:var(--ink-2);margin:-4px 0 0;letter-spacing:.01em}
.tr{font-family:var(--f-tr);font-size:1rem;line-height:1.6;margin:0;color:var(--ink)}
.tr-sub{font-family:var(--f-display);font-size:.95rem;color:var(--ink-2);margin:0}
.hidden-text{font-family:var(--f-display);font-size:1.45rem;letter-spacing:.3em;color:var(--grey)}
.speak{flex:none;border:0;width:40px;height:40px;border-radius:50%;background:var(--plaid);color:#fff;font-size:1rem}
.speak.sm{width:34px;height:34px;font-size:.85rem;background:#E2E8F3;color:var(--plaid)}
.speak.big{width:auto;height:auto;border-radius:12px;padding:10px 14px;font-weight:700;font-size:.95rem}
.next{align-self:flex-end;border:0;background:transparent;font-weight:700;color:var(--orange);padding:6px 4px}
.prompt{font-weight:700;margin:0}
.prompt .tr{font-weight:400;font-size:.9rem;color:var(--ink-2)}
.stem{font-family:var(--f-display);font-size:1.35rem;background:var(--paper);border-radius:12px;padding:10px 12px;margin:0}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;min-height:52px}
.opt .e{font-size:1.5rem;flex:none}
.opt .o{display:flex;flex-direction:column;min-width:0}
.opt .o b{font-family:var(--f-display);font-size:1.2rem;font-weight:700}
.opt .o i{font-style:normal;font-size:.78rem;color:var(--ink-2)}
.fb{display:flex;align-items:center;gap:10px;margin:12px 0 2px;padding:10px 14px;border-radius:14px;font-size:1.05rem;animation:popin .3s cubic-bezier(.2,1.4,.4,1)}
.fb.good{background:var(--ok-soft);border:2px solid var(--ok)}
.fb.oops{background:var(--no-soft);border:2px solid var(--no)}
.fb-i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;color:#fff;font-weight:700;flex:none}
.fb.good .fb-i{background:var(--ok)} .fb.oops .fb-i{background:var(--no)}
.fb-tr{color:var(--ink-2);font-size:.85rem;margin-left:auto}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.no{border-color:var(--no);background:var(--no-soft);opacity:.65;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.src{font-size:.72rem;color:var(--grey);margin:0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.act b{font-family:var(--f-display);font-size:1.1rem}
.act span{font-family:var(--f-tr);font-size:.75rem;color:var(--ink-2)}
.act em{font-style:normal;font-size:.72rem;color:var(--orange);font-weight:700}
.act[disabled]{opacity:.4}
.poster{border:2px dashed var(--plaid);border-radius:12px;padding:10px 12px;background:#F7F9FB}
.poster h3{margin:0 0 6px;font-family:var(--f-display);font-size:1.2rem;text-align:center;letter-spacing:.3em}
.poster dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-family:var(--f-display);font-size:1.05rem}
.poster dt{color:var(--ink-2)}.poster dd{margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--plaid);color:#fff;padding:10px 16px;border-radius:14px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.2);z-index:20;max-width:calc(100% - 32px)}

/* ---------- end ---------- */
.end{display:flex;flex-direction:column;gap:14px}
.end h2{font-family:var(--f-display);font-size:1.8rem;margin:0}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--ink-2)}
.friends{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.friend{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 4px;text-align:center;min-width:0}
.friend img{height:70px}
.friend .hearts{color:var(--orange);letter-spacing:2px}
.cards{display:flex;flex-wrap:wrap;gap:8px}
.opt .e img.ei{width:40px;height:40px;object-fit:contain;display:block}
.cardpop{position:fixed;inset:0;background:rgba(27,42,54,.55);display:grid;place-items:center;z-index:30;animation:fadein .2s}
.cc{background:#fff;border-radius:22px;padding:18px 22px 14px;width:min(280px,80vw);text-align:center;box-shadow:0 12px 32px rgba(0,0,0,.3);border:4px solid var(--orange);animation:popin .35s cubic-bezier(.2,1.4,.4,1)}
.cc-tag{display:inline-block;background:var(--orange);color:#fff;font-weight:700;font-size:.8rem;padding:3px 10px;border-radius:99px;margin-bottom:8px}
.cc img{width:70%;max-height:150px;object-fit:contain;display:block;margin:6px auto}
.cc-name{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--f-display);font-size:1.7rem}
.cc i{display:block;color:var(--ink-2);font-style:normal;font-size:.9rem}
.cc-tap{margin-top:10px;font-size:.8rem;color:var(--grey)}
@keyframes popin{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}}
.wish{background:#FFF6D8;border:1px dashed #E2A11C;border-radius:12px;padding:10px 12px;font-family:var(--f-display);font-size:1.05rem}
.devbox{border:2px dashed var(--orange);border-radius:12px;padding:10px;margin:6px 0 10px;display:grid;gap:8px;background:#FFF8F0}
.devrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.devrow select{flex:1;min-width:0;max-width:100%}
.cardchip img{width:22px;height:22px;object-fit:contain;vertical-align:middle;margin-right:4px;background:#fff;border-radius:6px}
.cardchip{background:var(--plaid);color:#fff;border-radius:10px;padding:6px 10px;font-size:.85rem}
dialog{border:0;border-radius:18px;padding:18px;max-width:min(420px,calc(100vw - 32px));color:var(--ink);background:var(--card)}
dialog::backdrop{background:rgba(27,42,54,.4)}
dialog.mapdlg{padding:0;width:min(420px,calc(100vw - 16px));max-height:calc(100vh - 24px);overflow:auto;background:#F3EFE4}
.jm{padding:16px 14px 24px;display:flex;flex-direction:column;gap:16px}
.jm-head{background:#FFFEF8;border:1px solid #E2DCCB;border-radius:18px;padding:16px 14px;display:flex;flex-direction:column;gap:10px;position:sticky;top:0;z-index:2}
.jm-head h2{margin:0;font-size:1.35rem}
.jm-bar{height:10px;border-radius:5px;background:#E5DFD0;overflow:hidden}.jm-bar i{display:block;height:100%;background:#0C7F73;border-radius:5px}
.jm-legend{display:flex;gap:6px;flex-wrap:wrap;font-size:.75rem}
.jm-pill{font-size:.75rem;border-radius:10px;padding:3px 8px;white-space:nowrap}
.jm-school{background:#0C7F73;color:#fff}.jm-work{background:#FFD84D;color:#1B2A36}.jm-common{background:#D9D4C7;color:#1B2A36}.jm-unk{border:1px dashed #9A937F;color:#4A5560}
.jm-year h3{margin:0 4px 8px;font-size:1.15rem;display:flex;gap:8px;align-items:baseline}.jm-year h3 small{font-size:.8rem;font-weight:400;color:#4A5560}
.jm-row{display:flex;gap:10px}
.jm-rail{width:36px;display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.jm-node{width:34px;height:34px;border-radius:17px;display:grid;place-items:center;font-weight:900;background:#D9D4C7;color:#4A5560}
.jm-node.done{background:#0C7F73;color:#fff}.jm-node.cur{background:#C9402B;color:#fff;box-shadow:0 0 0 4px #F4C9C1}
.jm-line{width:3px;flex-grow:1;margin-top:4px;border-radius:2px;background:repeating-linear-gradient(#C9C2B0 0 6px,transparent 6px 11px)}.jm-line.done{background:#0C7F73}
.jm-card{flex:1;min-width:0;margin-bottom:12px;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;background:#FFFEF8;border:1px solid #E2DCCB}
.jm-card.cur{border:2px solid #C9402B}.jm-card.lock{background:#ECE7DA;border:1px dashed #C9C2B0}
.jm-card .t{display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:700}
.jm-card .th{font-size:.82rem;color:#4A5560}
.jm-tag{background:#C9402B;color:#fff;font-size:.72rem;border-radius:10px;padding:3px 8px;white-space:nowrap}
.jm-ev{display:flex;flex-direction:column;gap:4px;font-size:.88rem}.jm-ev div{display:flex;gap:6px;align-items:center}.jm-ev .q{color:#5B6168;letter-spacing:2px}
.jm-cards{display:flex;gap:6px;flex-wrap:wrap}
.jm-k{display:flex;align-items:center;gap:4px;font-size:.75rem;border-radius:8px;padding:2px 7px 2px 3px;background:#FFF4C2;border:1px solid #E8C547}
.jm-k img{width:22px;height:22px;object-fit:contain}.jm-k.miss{background:none;border:1px dashed #9A937F;color:#5B6168;padding:2px 7px}
.jm-ends{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.jm-end{background:#ECE7DA;border:1px dashed #B9B2A2;border-radius:14px;padding:12px 6px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;font-size:.85rem}.jm-end small{font-size:.72rem;color:#4A5560}.jm-end.got{background:#E3F2EE;border:1px solid #0C7F73}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.slip{display:flex;flex-direction:column;margin-top:8px}
.slip-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.slip-row.big{border-bottom:0;font-size:1.15rem;padding-top:10px}
.slip-row.big b{color:var(--orange)}
</style>

function statusOf(day, chArg, grpArg){

  const m=day.m, base=Math.floor((CH-1)/4)+1;
  // 每 4 章一學年（7–9、10–12、1–3、4–6 月）；第 1、5、9 章的 7–8 月屬於上一學年
  const yr = ((CH-1)%4===0 && m<9) ? base-1 : base;
  if(yr<=0) return 'common';                        // 剛到台灣的 7–8 月：共同行程
  let block;
  if(m>=9 && m<=11) block=1; else if(m===12 || m<=2) block=2;
  else if(yr>=3){ if(m<=4) block=3; else if(m<=6) block=4; else return 'common'; } // 三下：3–4、5–6 月

    if(st.n){ panel.innerHTML=''; panel.append(el('p',{class:'tr'},fillTr(L(st.n))), zhLine(st.n.zh)); await waitTap(); continue; }
    if(st.say){ showSay(st); if(st.listen) continue; await waitTap(); continue; }
    if(st.poster){ panel.innerHTML=''; panel.append(el('div',{class:'poster'}, el('h3',{},st.title||'徵　才'), el('button',{class:'speak big',style:'margin:0 auto 8px;display:block',onclick:()=>speak(st.poster.map(([a,b])=>(a?a+'，':'')+fill(b)).join('。'))},'🔊 唸給我聽'), el('dl',{}, st.poster.flatMap(([a,b])=>[el('dt',{},a),el('dd',{},fill(b))])))); continue; }
    if(st.q){ await runQ(st.q, ctx); continue; }
    if(st.fx){ applyFx(st.fx); continue; }
    if(st.card){ if(!S.cards.includes(st.card)) S.cards.push(st.card); save(); await showCard(st.card); continue; }
    if(st.title){ if(!S.titles.includes(st.title)) S.titles.push(st.title); toast('獲得稱號：'+TITLES[st.title]); continue; }
    if(st.ifHomeZh){ await runSteps(st.ifHomeZh.includes(hero().home.zh)?st.then:st.else, ctx); continue; }
    if(st.ifHome){ await runSteps(st.ifHome.includes(hero().home.lang)?st.then:st.else, ctx); continue; }
    if(st.redo){ S.redo=S.redo||{}; if(!S.redo[st.redo]) S.redo[st.redo]={ch:S.ch,day:S.day}; save(); continue; }
    if(st.violation){ S.viol=(S.viol||0)+st.violation; save(); continue; }
    if(st.ifv){ await runSteps(S[st.ifv]?st.then:st.else, ctx); continue; }
    if(st.link){ panel.innerHTML=''; panel.append(el('p',{class:'tr'},L(st.link.tr)), zhLine(st.link.zh), el('a',{class:'btn ghost linkbtn',href:st.link.href,target:'_blank',rel:'noopener'},st.link.label+' ↗')); await waitTap(); continue; }
    if(st.ifMoney){ await runSteps(S.st.money>=st.ifMoney?st.then:st.else, ctx); continue; }
    if(st.ifDept){ await runSteps(dept().zh===st.ifDept?st.then:st.else, ctx); continue; }
    if(st.setv){ Object.assign(S, st.setv); save(); continue; }
    if(st.thanks){ await thanksCard(ctx); continue; }
    if(st.ifStatus){ await runSteps(statusOf(days()[S.day])===st.ifStatus?st.then:st.else, ctx); continue; }
    if(st.ifTidy){ await runSteps(((S.st.tidy??100)>=st.ifTidy)?st.then:st.else, ctx); continue; }
    if(st.trash0){ S.trash=0; continue; }
    if(st.set){ S[st.set]=1; continue; }
    if(st.exam){ const sc=await runExam(st.exam); S['exam'+S.ch]=sc; S['examN'+S.ch]=st.exam; const hit=st.res.find(([min])=>sc>=min); if(hit) await runSteps(hit[1], ctx); continue; }
    if(st.ifScore){ await runSteps((ctx.ok>=st.ifScore)?st.then:st.else, ctx); continue; }
  }
}

async function runExam(n){

  const rest = DATA.bank.filter(b=>!S.missed.includes(b.no)).sort(()=>Math.random()-.5);
  const list = [...missed.sort(()=>Math.random()-.5), ...rest].slice(0,n);

    panel.innerHTML=''; app.classList.add('q');

    const box=el('div',{class:'opts'});

      btns.forEach(x=>box.append(x)); panel.append(box);
    });
    S.qTot++;
    if(ok){ score++; S.qOk++; S.st.zh=clamp(S.st.zh+1,0,100); S.missed=S.missed.filter(x=>x!==b.no); }
    else if(!S.missed.includes(b.no)) S.missed.push(b.no);

  return score;
}

const isDev=()=>{ try{ return sessionStorage.getItem('twdiary_dev')==='1'; }catch(e){ return !!window.__dev; } };
const setDev=(on)=>{ window.__dev=on; try{ on?sessionStorage.setItem('twdiary_dev','1'):sessionStorage.removeItem('twdiary_dev'); }catch(e){} };
const DEV_HASH=0; // 開發者模式密碼的雜湊值；0 = 停用。設定方式：node tools/dev-hash.js 你的密碼
const devHash=(str,seed=7)=>{ let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed; for(let i=0;i<str.length;i++){ const ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507); h1^=Math.imul(h2^(h2>>>13),3266489909); h2=Math.imul(h2^(h2>>>16),2246822507); h2^=Math.imul(h1^(h1>>>13),3266489909); return 4294967296*(2097151&h2)+(h1>>>0); };

/* ---------- 存檔代碼：壓縮存檔 → 代碼／QR Code，換裝置貼上或掃描就能接著玩 ---------- */
const SAVE_PFX='TW1.';
async function packSave(){
  const o={...S}; delete o.usedBank;
  let bytes=new TextEncoder().encode(JSON.stringify(o)), z='0';
  if(window.CompressionStream){ try{ const cs=new CompressionStream('deflate-raw'); const w=cs.writable.getWriter(); w.write(bytes); w.close(); bytes=new Uint8Array(await new Response(cs.readable).arrayBuffer()); z='1'; }catch(e){} }
  let s=''; for(let i=0;i<bytes.length;i++) s+=String.fromCharCode(bytes[i]);
  return SAVE_PFX+z+btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function unpackSave(code){
  code=(code||'').trim().replace(/\s+/g,'');
  const m=code.match(/#save=(.+)$/); if(m) code=decodeURIComponent(m[1]);
  if(!code.startsWith(SAVE_PFX)) throw new Error('prefix');
  const z=code[SAVE_PFX.length]; let b64=code.slice(SAVE_PFX.length+1).replace(/-/g,'+').replace(/_/g,'/'); while(b64.length%4) b64+='=';
  let bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  if(z==='1'){ const ds=new DecompressionStream('deflate-raw'); const w=ds.writable.getWriter(); w.write(bytes); w.close(); bytes=new Uint8Array(await new Response(ds.readable).arrayBuffer()); }
  const o=JSON.parse(new TextDecoder().decode(bytes));
  if(!o || !o.hero || !o.st) throw new Error('data');
  o.usedBank=o.usedBank||[]; o.missed=o.missed||[]; return o;
}

}

    box.append(el('h4',{style:'margin:4px 0'},'我的存檔代碼'), el('p',{class:'small',style:'margin:2px 0 6px'},saveWhere(S)),

  vc.onchange=()=>{S.voice=vc.value; pickVoice(); save(); speak('你好，歡迎來到台灣。');};

/* ---------- boot ---------- */
function start(data){ if(data && data.hero && data.screen){ S=data; render(); if(S.screen==='game') runDay(); } else render();
  const h=location.hash.match(/^#save=(.+)$/); if(h) setTimeout(()=>openSaveCode(decodeURIComponent(h[1])),300); }
window.addEventListener('hashchange',()=>{ const h=location.hash.match(/^#save=(.+)$/); if(h) openSaveCode(decodeURIComponent(h[1])); });
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
